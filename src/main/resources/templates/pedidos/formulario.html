<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecera('Nuevo pedido')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: menu}"></nav>

<main class="container my-4">
    <h1 class="h3 mb-3">Registrar nuevo pedido</h1>

    <div th:replace="~{fragmentos/layout :: mensajes}"></div>

    <p class="text-muted" th:if="${#lists.isEmpty(clientes)}">No hay clientes activos disponibles.</p>

    <form class="card card-body" method="post" th:action="@{/pedidos/crear}"
          th:unless="${#lists.isEmpty(clientes)}">

        <div class="mb-3">
            <label class="form-label" for="idCliente">Cliente</label>
            <select class="form-select" id="idCliente" name="idCliente" required>
                <option value="">Seleccione un cliente</option>
                <option th:each="c : ${clientes}"
                        th:value="${c.id}"
                        th:text="${c.nombreCompleto} + ' - ' + ${c.documento}"></option>
            </select>
        </div>

        <h2 class="h5">Productos y menus del pedido</h2>

        <div id="detalles">
            <div class="row g-2 mb-2 detalle">
                <div class="col-md-7">
                    <select class="form-select" name="articulo" required>
                        <option value="">Seleccione un articulo</option>
                        <th:block th:each="p : ${productos}">
                            <option th:if="${p.activo}"
                                    th:value="'P:' + ${p.id}"
                                    th:text="'Producto: ' + ${p.nombre} + ' - Q' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')} + ' (existencia: ' + ${p.existencia} + ')'"></option>
                        </th:block>
                        <option th:each="m : ${menus}"
                                th:value="'M:' + ${m.id}"
                                th:text="'Menu: ' + ${m.nombre} + ' - Q' + ${#numbers.formatDecimal(m.precio, 1, 'COMMA', 2, 'POINT')}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="number" class="form-control" name="cantidad" min="1" value="1" required>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-outline-danger w-100 quitar">Quitar</button>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-2">
            <button type="button" class="btn btn-outline-secondary" id="agregar">Agregar otro articulo</button>
            <button type="submit" class="btn btn-marca">Registrar pedido</button>
            <a class="btn btn-secondary" th:href="@{/pedidos}">Cancelar</a>
        </div>
    </form>
</main>

<script th:replace="~{fragmentos/layout :: scripts}"></script>
<script th:src="@{/js/pedido-formulario.js}"></script>
</body>
</html>
