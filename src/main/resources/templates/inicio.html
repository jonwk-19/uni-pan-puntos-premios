<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecera('Inicio')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: menu}"></nav>

<main class="container my-4">
    <h1 class="h3">Pan, Puntos y Premios</h1>
    <p class="text-muted">Sistema de pedidos y fidelizacion del restaurante.</p>

    <div th:replace="~{fragmentos/layout :: mensajes}"></div>

    <div class="row g-3">
        <div class="col-6 col-md-4">
            <a class="card tarjeta-modulo p-4 text-center" th:href="@{/productos}">Productos</a>
        </div>
        <div class="col-6 col-md-4">
            <a class="card tarjeta-modulo p-4 text-center" th:href="@{/inventario}">Inventario</a>
        </div>
        <div class="col-6 col-md-4">
            <a class="card tarjeta-modulo p-4 text-center" th:href="@{/clientes}">Clientes</a>
        </div>
        <div class="col-6 col-md-4">
            <a class="card tarjeta-modulo p-4 text-center" th:href="@{/pedidos}">Pedidos</a>
        </div>
        <div class="col-6 col-md-4">
            <a class="card tarjeta-modulo p-4 text-center" th:href="@{/recompensas}">Recompensas</a>
        </div>
        <div class="col-6 col-md-4">
            <a class="card tarjeta-modulo p-4 text-center" th:href="@{/reportes}">Reportes</a>
        </div>
    </div>
</main>

<script th:replace="~{fragmentos/layout :: scripts}"></script>
</body>
</html>
